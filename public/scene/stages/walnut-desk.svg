<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1400" width="2400" height="1400" role="img" aria-label="An overhead view of a walnut executive desk with a leather writing pad">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a2c1a"/>
      <stop offset="0.45" stop-color="#633b22"/>
      <stop offset="1" stop-color="#38200f"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#23262c"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8cf94"/>
      <stop offset="0.5" stop-color="#b8942f"/>
      <stop offset="1" stop-color="#8a6c1c"/>
    </linearGradient>

    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="dropSm" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.38"/>
    </filter>

    <!-- Subtle wood grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.012" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <filter id="leatherGrain">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
    </filter>

    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Desk surface. Documents and screens are live items, not drawn here. -->
  <rect width="2400" height="1400" fill="url(#wood)"/>
  <rect width="2400" height="1400" filter="url(#grain)" opacity="0.9"/>

  <!-- Plank seams -->
  <g stroke="#2a170a" stroke-opacity="0.5" stroke-width="3">
    <line x1="0" y1="300" x2="2400" y2="300"/>
    <line x1="0" y1="720" x2="2400" y2="720"/>
    <line x1="0" y1="1120" x2="2400" y2="1120"/>
  </g>

  <!-- Leather desk pad -->
  <g filter="url(#drop)">
    <rect x="90" y="40" width="2230" height="1290" rx="18" fill="url(#leather)"/>
    <rect x="90" y="40" width="2230" height="1290" rx="18" filter="url(#leatherGrain)"/>
    <rect x="112" y="62" width="2186" height="1246" rx="10" fill="none" stroke="#3a3f47" stroke-width="3"/>
  </g>

  <!-- Pen -->
  <g transform="rotate(-24 1330 1290)" filter="url(#dropSm)">
    <rect x="1180" y="1276" width="300" height="26" rx="13" fill="#5b1a1f"/>
    <rect x="1180" y="1276" width="66" height="26" rx="13" fill="url(#brass)"/>
    <path d="M1480 1276 l38 13 l-38 13 z" fill="url(#brass)"/>
  </g>

  <!-- Lighting -->
  <rect width="2400" height="1400" fill="url(#vignette)"/>
</svg>
